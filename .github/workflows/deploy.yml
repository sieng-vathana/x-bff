name: Build and deploy x-bff
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: github-x-sharedlib
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - uses: actions/checkout@v4
        with:
          repository: sieng-vathana/x-sharedlib
          path: x-sharedlib
      - run: mvn --batch-mode --no-transfer-progress -DskipTests install -f x-sharedlib/pom.xml
      - run: mvn --batch-mode --no-transfer-progress -DskipTests package
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/sieng-vathana/x-bff:main
            ghcr.io/sieng-vathana/x-bff:${{ github.sha }}

  deploy:
    needs: build
    runs-on: [self-hosted, linux, x64, x-platform-deploy]
    steps:
      - name: Roll out x-bff
        run: |
          sudo k3s kubectl -n x-platform create deployment x-bff --image=ghcr.io/sieng-vathana/x-bff:${{ github.sha }} --dry-run=client -o yaml | sudo k3s kubectl apply -f -
          sudo k3s kubectl -n x-platform expose deployment x-bff --port=8080 --target-port=8080 --dry-run=client -o yaml | sudo k3s kubectl apply -f -
          sudo k3s kubectl -n x-platform set env deployment/x-bff SERVER_PORT=8080 SPRING_PROFILES_ACTIVE=production USER_SERVICE_URL=http://x-user-service.x-platform.svc.cluster.local:8080/internal/users SERVICES_CUSTOMER_BASE_URL=http://x-customer-service.x-platform.svc.cluster.local:8080 SPRING_DATASOURCE_URL=jdbc:mysql://mysql.x-platform.svc.cluster.local:3306/x_prod SPRING_JPA_HIBERNATE_DDL_AUTO=update --from=secret/x-app-database
          sudo k3s kubectl -n x-platform patch deployment x-bff --type='strategic' -p='{"spec":{"strategy":{"type":"RollingUpdate","rollingUpdate":{"maxUnavailable":0,"maxSurge":1}},"template":{"spec":{"containers":[{"name":"x-bff","readinessProbe":{"tcpSocket":{"port":8080},"initialDelaySeconds":5,"periodSeconds":5,"timeoutSeconds":2,"failureThreshold":6,"successThreshold":1},"startupProbe":{"tcpSocket":{"port":8080},"periodSeconds":5,"timeoutSeconds":2,"failureThreshold":24}}]}}}}'
          sudo k3s kubectl -n x-platform rollout status deployment/x-bff --timeout=180s

  notify:
    if: always()
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram pipeline alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          APP_NAME: ${{ github.event.repository.name }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
          COMMITTER: ${{ github.event.head_commit.author.name || github.actor }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'Manual workflow dispatch' }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Telegram notification skipped; configure TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID."
            exit 0
          fi

          stage_icon() {
            case "$1" in
              success) printf '✅ Success' ;;
              failure) printf '🛑 Failed' ;;
              cancelled) printf '🚫 Cancelled' ;;
              *) printf '⏭ Skipped' ;;
            esac
          }

          html_escape() {
            sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'
          }

          if [ "$BUILD_RESULT" = success ] && [ "$DEPLOY_RESULT" = success ]; then
            title='🟢 CI/CD PIPELINE SUCCEEDED'
          else
            title='🔴 CI/CD PIPELINE FAILED'
          fi

          short_sha=${GITHUB_SHA::7}
          build_time=$(TZ=Asia/Phnom_Penh date '+%d-%b-%Y | %I:%M %p')
          committer=$(printf '%s' "$COMMITTER" | html_escape)
          commit_message=${COMMIT_MESSAGE%%$'\n'*}
          commit_message=$(printf '%s' "$commit_message" | html_escape)
          container_image="${IMAGE_REPOSITORY}:${GITHUB_SHA}"

          message=$(printf '%s\n\n📌 Project Details\n• Environment : production\n• Project     : x-platform\n• Application : %s\n• Build #     : #%s\n• Time        : %s\n\n%s\n• Build & Push Image: %s\n• Deploy K3s        : %s\n\n🐳 Container Image\n<code>%s</code>\n\n👤 Commit Info\n• Branch    : origin/%s (<code>%s</code>)\n• Committer : %s\n• Message   : %s' \
            "$title" "$APP_NAME" "$GITHUB_RUN_NUMBER" "$build_time" \
            "$([ "$title" = '🟢 CI/CD PIPELINE SUCCEEDED' ] && printf '✅ Stage Breakdown' || printf '❌ Stage Breakdown')" \
            "$(stage_icon "$BUILD_RESULT")" \
            "$(stage_icon "$DEPLOY_RESULT")" \
            "$container_image" "$GITHUB_REF_NAME" "$short_sha" "$committer" "$commit_message")

          jq -n \
            --arg chat_id "$TELEGRAM_CHAT_ID" \
            --arg message_thread_id "$TELEGRAM_MESSAGE_THREAD_ID" \
            --arg text "$message" \
            '{chat_id: $chat_id, text: $text, parse_mode: "HTML", disable_web_page_preview: true}
             + if $message_thread_id == "" then {} else {message_thread_id: ($message_thread_id | tonumber)} end' \
            | curl --fail --silent --show-error \
                -H 'Content-Type: application/json' \
                --data-binary @- \
                "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                >/dev/null
