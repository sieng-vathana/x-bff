server:
  port: ${BFF_SERVICE_PORT:8443}

spring:
  banner:
    location: classpath:banner.txt
    mode: console
  main:
    web-application-type: reactive
  application:
    name: x-bff
  profiles:
    default: local
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      properties:
        # Realtime events are best effort; never wait long for a missing broker.
        max.block.ms: 2000

jwt:
  # Local default so IntelliJ / ./x.sh work without env vars.
  # Override in real environments: export JWT_SECRET='...'
  secret: ${JWT_SECRET:x-local-jwt-secret-change-me-32chars}
  expiration: ${JWT_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:86400000}

x:
  http:
    logging:
      enabled: true
      server: x-bff
      hop: "x-api-gateway → x-bff"
      hops:
        /api/v1/auth: "x-api-gateway → x-bff → x-user-service"
        /api/v1/files: "x-api-gateway → x-bff → x-storage-service"
        /api/v1/products: "x-api-gateway → x-bff → x-product-service"
        /api/v1/orders: "x-api-gateway → x-bff → x-order-service"
        /api/v1/businesses: "x-api-gateway → x-bff → x-business-service"
        /api/v1/stores: "x-api-gateway → x-bff → x-store-service"
        /api/v1/stock: "x-api-gateway → x-bff → x-inventory-service"
        /api/v1/home: "x-api-gateway → x-bff → x-inventory-service"
        /api/v1/payments: "x-api-gateway → x-bff → x-payment-service"
        /api/v1/deliveries: "x-api-gateway → x-bff → x-delivery-service"
